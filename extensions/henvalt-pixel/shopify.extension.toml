type = "web_pixel_extension"
name = "HENVALT Storefront Signals"
uid = "a2b85cac-ea22-7e01-c7a8-907b2878f513d274d07e"
runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.collectorUrl]
name = "Collector URL"
description = "HENVALT's event collection endpoint"
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]

[settings.fields.publicKey]
name = "Public key"
description = "Store-specific HENVALT public pixel key"
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]
