name: HENVALT signed Shopify staging webhook test

on:
  workflow_dispatch:
    inputs:
      shop:
        description: Explicit Shopify development store domain
        required: true
        type: string
      topic:
        description: Shopify webhook topic
        required: true
        type: choice
        options:
          - checkouts/update
          - carts/update
          - orders/create
        default: checkouts/update

permissions:
  contents: read

jobs:
  signed-webhook:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send a synthetic Shopify-HMAC-signed test event to isolated staging only
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.HENVALT_STAGE_SHOPIFY_CLIENT_SECRET }}
          SHOP: ${{ inputs.shop }}
          TOPIC: ${{ inputs.topic }}
          ENDPOINT: ${{ vars.HENVALT_STAGE_SHOPIFY_WEBHOOK_INGRESS_URL }}
          NO_SEND: ${{ vars.HENVALT_STAGE_NO_SEND }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');

          const secret = process.env.SHOPIFY_CLIENT_SECRET;
          const shop = (process.env.SHOP || '').trim().toLowerCase();
          const topic = (process.env.TOPIC || '').trim().toLowerCase();
          const endpoint = process.env.ENDPOINT;
          if (!secret) throw new Error('Missing staging-only GitHub secret: HENVALT_STAGE_SHOPIFY_CLIENT_SECRET');
          if (process.env.NO_SEND !== 'true') throw new Error('Refusing webhook test: HENVALT_STAGE_NO_SEND must be true');
          if (!/^[a-z0-9][a-z0-9-]*\.myshopify\.com$/.test(shop)) throw new Error('Invalid .myshopify.com development store domain');
          if (!['checkouts/update', 'carts/update', 'orders/create'].includes(topic)) throw new Error('Unsupported test topic');
          let target;
          try { target = new URL(endpoint); } catch { throw new Error('Missing or invalid HENVALT_STAGE_SHOPIFY_WEBHOOK_INGRESS_URL repository variable'); }
          if (target.protocol !== 'https:' || target.pathname !== '/shopify/webhooks' ||
              target.hostname !== 'henvalt-shopify-ingress-staging-no-send.chmuhammadrehan18.workers.dev') {
            throw new Error('Refusing to send to a non-staging webhook endpoint');
          }
          const now = new Date().toISOString();
          const id = Date.now();
          const payload = topic === 'checkouts/update'
            ? { id, token: 'henvalt-synthetic-test', cart_token: 'henvalt-synthetic-cart', email: null, currency: 'USD', total_price: '0.00', created_at: now, updated_at: now, line_items: [] }
            : topic === 'carts/update'
              ? { id, token: 'henvalt-synthetic-cart', currency: 'USD', total_price: '0.00', created_at: now, updated_at: now, items: [] }
              : { id, name: '#HENVALT-TEST', test: true, currency: 'USD', total_price: '0.00', created_at: now, updated_at: now, line_items: [] };

          const raw = JSON.stringify(payload);
          const hmac = crypto.createHmac('sha256', secret).update(raw, 'utf8').digest('base64');
          const webhookId = crypto.randomUUID();

          fetch(target, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-shopify-shop-domain': shop,
              'x-shopify-topic': topic,
              'x-shopify-hmac-sha256': hmac,
              'x-shopify-webhook-id': webhookId,
              'x-shopify-event-id': webhookId,
              'x-shopify-api-version': '2026-10',
              'x-shopify-triggered-at': now
            },
            body: raw
          }).then(async response => {
            const responseText = await response.text();
            console.log('HTTP status:', response.status);
            console.log('Response:', responseText.slice(0, 1500));
            if (!response.ok) process.exitCode = 1;
          }).catch(error => {
            console.error('Request failed:', error.message);
            process.exitCode = 1;
          });
          NODE
