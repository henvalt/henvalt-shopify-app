name: Shopify app configuration checks and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check privacy Edge Functions
        run: deno check supabase/functions/henvalt-shopify-privacy/index.ts supabase/functions/henvalt-privacy-export/index.ts
      - name: Validate Shopify TOML, Pixel source, collector, and ingest contract
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          app = tomllib.loads(pathlib.Path("shopify.app.toml").read_text())
          ext = tomllib.loads(pathlib.Path("extensions/henvalt-pixel/shopify.extension.toml").read_text())
          package = json.loads(pathlib.Path("extensions/henvalt-pixel/package.json").read_text())

          assert app["client_id"], "Missing Shopify Client ID"
          assert app["application_url"].startswith("https://"), "Application URL must use HTTPS"
          assert "read_orders" in app["access_scopes"]["scopes"].split(","), "Missing read_orders scope"
          assert "write_pixels" in app["access_scopes"]["scopes"].split(","), "Missing write_pixels scope"
          assert "read_customer_events" in app["access_scopes"]["scopes"].split(","), "Missing read_customer_events scope"
          assert app["auth"]["redirect_urls"], "Missing OAuth callback URL"
          assert ext["type"] == "web_pixel_extension", "Unexpected extension type"
          assert ext["runtime_context"] == "strict", "Pixel must use strict runtime"
          assert set(ext["settings"]["fields"]) == {"collectorUrl", "publicKey"}, "Pixel settings schema mismatch"
          assert package["dependencies"]["@shopify/web-pixels-extension"], "Missing Shopify Web Pixels API dependency"

          source = pathlib.Path("extensions/henvalt-pixel/src/index.js").read_text()
          collector = pathlib.Path("cloudflare/pixel-collector.js").read_text()
          ingest = pathlib.Path("supabase/migrations/202611140001_allow_product_removed_from_cart_pixel_event.sql").read_text()
          for event in ("page_viewed", "product_viewed", "product_added_to_cart", "product_removed_from_cart", "checkout_started"):
              assert event in source, f"Missing pixel subscription: {event}"
              assert event in collector, f"Collector rejects subscribed pixel event: {event}"
              assert event in ingest, f"Supabase ingest rejects subscribed pixel event: {event}"
          assert "fetch(" in source, "Missing collector delivery"

          privacy_topics = {"customers/data_request", "customers/redact", "shop/redact"}
          subscriptions = app.get("webhooks", {}).get("subscriptions", [])
          configured = set()
          for subscription in subscriptions:
              configured.update(subscription.get("compliance_topics", []))
          assert privacy_topics <= configured, f"Missing Shopify compliance topics: {privacy_topics - configured}"
          privacy_uri = next((s.get("uri", "") for s in subscriptions if privacy_topics <= set(s.get("compliance_topics", []))), "")
          assert privacy_uri == "https://ocyplckdojdubyrsxcxa.supabase.co/functions/v1/henvalt-shopify-privacy", "Unexpected privacy webhook destination"

          privacy_handler = pathlib.Path("supabase/functions/henvalt-shopify-privacy/index.ts").read_text()
          privacy_migration = pathlib.Path("supabase/migrations/202611140002_shopify_privacy_request_queue.sql").read_text()
          for required in ("x-shopify-hmac-sha256", "customers/data_request", "customers/redact", "shop/redact", "invalid_hmac"):
              assert required in privacy_handler, f"Privacy handler missing {required}"
          assert "shopify_privacy_requests" in privacy_handler and "shopify_privacy_requests" in privacy_migration, "Privacy queue schema/handler mismatch"
          assert "active=eq.true" not in privacy_handler, "Compliance requests must still resolve after app/uninstalled deactivates the connection"
          assert "enable row level security" in privacy_migration.lower(), "Privacy queue must have RLS enabled"

          customer_privacy = pathlib.Path("supabase/migrations/202611140003_shopify_customer_privacy_rpcs.sql").read_text().lower()
          export_storage = pathlib.Path("supabase/migrations/202611140004_shopify_privacy_export_storage.sql").read_text().lower()
          export_scheduler = pathlib.Path("supabase/migrations/202611140005_schedule_privacy_export_purge.sql").read_text().lower()
          for required in (
              "export_shopify_customer_data",
              "redact_shopify_customer_data",
              "redact_shopify_shop_data",
              "security definer",
              "set search_path = henvalt, pg_temp",
              "revoke all on function",
              "grant execute on function",
              "p_tenant_id",
              "p_shopify_customer_id",
              "canonical_events",
              "conversation_messages",
              "delivery_attempts",
              "delivery_requests",
              "provider_events",
              "messages",
              "recovery_interventions",
              "tracking_tokens",
              "unsubscribe_tokens",
              "webhook_events",
              "audit_log",
              "processing_errors",
          ):
              assert required in customer_privacy, f"Customer privacy RPC migration missing {required}"
          assert "from public, anon, authenticated" in customer_privacy, "Customer privacy RPCs must not be public"
          assert "where c.tenant_id = p_tenant_id" in customer_privacy, "Customer lookup must be tenant scoped"
          assert "delete from henvalt.email_suppressions" in customer_privacy, "Customer suppression rows must be removed without unique-key collisions"
          assert "delete from henvalt.tracking_tokens" in customer_privacy, "Customer tracking tokens must be removed"
          assert "dr.opportunity_id in" in customer_privacy and "cc.customer_id=any(v_customer_ids)" in customer_privacy, "Delivery redaction must be linked by customer even when email is absent"
          assert "result_payload jsonb" in export_storage and "result_expires_at timestamptz" in export_storage, "Customer export storage must be time-limited"
          assert "result_expires_at" in export_storage and "service_role" in export_storage, "Customer export storage must remain service-role only"
          assert "purge_expired_shopify_privacy_exports" in export_storage and "purge_expired_shopify_privacy_exports" in privacy_handler, "Expired customer exports must be purged on verified webhook traffic"
          assert "export_shopify_customer_data" in privacy_handler and "redact_shopify_customer_data" in privacy_handler and "redact_shopify_shop_data" in privacy_handler, "Privacy webhook does not invoke all scoped processors"
          assert "awaiting_secure_delivery" in privacy_handler, "Data export must not be marked complete before secure delivery"
          privacy_export = pathlib.Path("supabase/functions/henvalt-privacy-export/index.ts").read_text()
          dashboard = pathlib.Path("dashboard/index.html").read_text()
          assert r"replace(/^Bearer\s+/i" in privacy_export, "Privacy export must parse standard Bearer authorization headers"
          for required in ("auth/v1/user", "tenant_memberships", "role=in.(OWNER,ADMIN)", "tenant_id=eq.", "result_expires_at=gt.", "content-disposition"):
              assert required in privacy_export, f"Secure export endpoint missing {required}"
          assert "result_payload" in privacy_export and "result_delivered_at" in privacy_export, "Export delivery must audit downloads"
          assert "access-control-expose-headers" in privacy_export and "content-disposition" in privacy_export, "Dashboard must be able to read the export filename header"
          assert "purge_expired_shopify_privacy_exports" in privacy_export, "Dashboard access must also purge expired export data"
          assert "customer_id: exportFound ? null : customerId" in privacy_handler, "Generated exports must minimise retained request identifiers"
          assert "customer_id: null" in privacy_handler, "Completed redactions must clear the stored customer identifier"
          assert "PRIVACY_EXPORT_API" in dashboard and "loadPrivacyRequests" in dashboard and "downloadPrivacyExport" in dashboard, "Merchant dashboard missing privacy export UI"
          assert "data-page=\"privacy\"" in dashboard and "id=\"page-privacy\"" in dashboard, "Merchant dashboard privacy page is missing"
          assert "service_role" in export_storage, "Export storage must be service-role only"
          assert "cron.schedule" in export_scheduler and "henvalt-privacy-export-expiry-purge" in export_scheduler, "Privacy export expiry must have a named recurring Cron job"
          assert "*/15 * * * *" in export_scheduler and "purge_expired_shopify_privacy_exports" in export_scheduler, "Privacy export purge must run every 15 minutes"
          assert "to_regnamespace('cron')" in export_scheduler, "Scheduler migration must fail clearly when Supabase Cron is not enabled"
          print("HENVALT pixel contract and Shopify privacy webhook/export/redaction checks passed.")
          print("HENVALT pixel contract and Shopify privacy webhook configuration checks passed.")
          PY

  deploy-shopify-version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SHOPIFY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip deployment until Shopify token is configured
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN == ''
        run: echo "Deployment skipped. Add SHOPIFY_SERVICE_ACCOUNT_TOKEN in GitHub repository Actions secrets."
      - uses: actions/setup-node@v4
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        with:
          node-version: 22
      - name: Install Web Pixel extension dependencies
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: npm install --prefix extensions/henvalt-pixel --no-audit --no-fund
      - name: Install Shopify CLI
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: npm install --global @shopify/cli@latest
      - name: Scaffold Shopify-managed Pixel UID
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          mv extensions/henvalt-pixel /tmp/henvalt-pixel
          shopify app generate extension --template web_pixel --name "HENVALT Storefront Signals" --flavor vanilla-js --path .
          python3 - <<'PY'
          import pathlib, re, shutil
          root = pathlib.Path("extensions")
          candidates = [p for p in root.glob("*/shopify.extension.toml") if p.parent.name != "henvalt-pixel"]
          candidates = [p for p in candidates if re.search(r'^uid\s*=\s*"([^"]+)"', p.read_text(), re.M)]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one Shopify-generated scaffold with UID; found {len(candidates)}")
          match = re.search(r'^uid\s*=\s*"([^"]+)"', candidates[0].read_text(), re.M)
          original = pathlib.Path("/tmp/henvalt-pixel")
          target_dir = root / "henvalt-pixel"
          shutil.move(str(original), str(target_dir))
          target = target_dir / "shopify.extension.toml"
          lines = target.read_text().splitlines()
          existing_uid = re.search(r'^uid\s*=\s*"([^"]+)"', "\n".join(lines), re.M)
          if existing_uid:
              print("Existing Shopify-generated Pixel UID preserved.")
          else:
              for index, line in enumerate(lines):
                  if line.strip().startswith("name ="):
                      lines.insert(index + 1, 'uid = "' + match.group(1) + '"')
                      break
              else:
                  raise SystemExit("Target extension name field not found")
              target.write_text("\n".join(lines) + "\n")
          for candidate in candidates:
              shutil.rmtree(candidate.parent)
          print("Shopify-generated UID applied to HENVALT Pixel extension.")
          PY
      - name: Persist Shopify-generated Pixel UID
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/henvalt-pixel/shopify.extension.toml
          if ! git diff --cached --quiet; then
            git commit -m "Persist Shopify-generated Pixel UID [skip ci]"
            git push
          fi
      - name: Create an unreleased Shopify app version
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: shopify app deploy --no-release --config=shopify.app.toml
