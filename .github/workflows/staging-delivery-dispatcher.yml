name: Staging delivery dispatcher

on:
  push:
    branches:
      - "work/staging-delivery-dispatcher"
    paths:
      - "supabase/functions/henvalt-delivery-dispatcher/**"
      - "supabase/functions/henvalt-mailersend-delivery/**"
      - "tests/henvalt-delivery-dispatcher-handler.test.mjs"
      - "tests/henvalt-mailersend-egress-fence.test.mjs"
      - ".github/workflows/staging-delivery-dispatcher.yml"
  pull_request:
    paths:
      - "supabase/functions/henvalt-delivery-dispatcher/**"
      - "supabase/functions/henvalt-mailersend-delivery/**"
      - "tests/henvalt-delivery-dispatcher-handler.test.mjs"
      - "tests/henvalt-mailersend-egress-fence.test.mjs"
      - ".github/workflows/staging-delivery-dispatcher.yml"

permissions:
  contents: read

jobs:
  safety-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run delivery dispatcher safety tests
        run: node --test tests/henvalt-delivery-dispatcher-handler.test.mjs tests/henvalt-mailersend-egress-fence.test.mjs
      - name: Type-check staging Edge Function
        run: deno check --no-remote supabase/functions/henvalt-delivery-dispatcher/index.ts supabase/functions/henvalt-mailersend-delivery/index.ts
