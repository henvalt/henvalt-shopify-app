name: Shopify ingress Worker validation

on:
  pull_request:
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/worker_test.ts"
      - ".github/workflows/shopify-ingress-validation.yml"

permissions:
  contents: read

jobs:
  shopify-ingress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ingress Worker
        run: deno check cloudflare/worker.js cloudflare/worker_test.ts
      - name: Test HMAC and forwarding contract
        run: deno test cloudflare/worker_test.ts
