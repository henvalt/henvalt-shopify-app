name: HENVALT exact-store identity V2 validation

on:
  push:
    branches: [prep/public-app-hardening-2026-11-15]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-v2-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run identity, cost reservation, and privacy contract tests
        run: node --test tests/customer-session-checkout-writer-audit.test.mjs tests/shopify-exact-store-identity-graph-v2.test.mjs tests/shopify-checkout-webhook-projection-v2.test.mjs tests/shopify-webhook-v2-edge-ingress.test.mjs tests/shopify-order-conversion-projection-v2.test.mjs tests/shopify-checkout-recovery-eligibility-v2.test.mjs tests/shopify-recovery-opportunity-v2.test.mjs tests/shopify-email-consent-evidence-v2.test.mjs tests/shopify-checkout-jurisdiction-projection-v2.test.mjs tests/v2-recipient-resolution-and-delivery-authorization-contract.test.mjs tests/shopify-mailer-provider-events-suppression-v2.test.mjs tests/shopify-single-use-delivery-authorization-v2.test.mjs tests/shopify-contact-resolution-delivery-v2.test.mjs tests/shopify-delivery-cost-reservations-v2.test.mjs tests/shopify-privacy-order-scope-v2.test.mjs tests/shopify-privacy-order-scope-report-v2.test.mjs tests/shopify-privacy-deadline-monitor-v2.test.mjs tests/shopify-privacy-processing-queue-v2.test.mjs tests/shopify-privacy-completion-evidence-gate-v2.test.mjs tests/shopify-privacy-export-artifact-registry-v2.test.mjs tests/shopify-privacy-export-download-v2.test.mjs tests/shopify-privacy-export-purge-lifecycle-v2.test.mjs tests/shopify-privacy-export-processor-v2.test.mjs tests/shopify-customer-privacy-export-v2.test.mjs tests/shopify-customer-redaction-impact-preview-v2.test.mjs tests/shopify-customer-redaction-fk-inventory-v2.test.mjs tests/shopify-customer-redaction-send-guard-v2.test.mjs tests/shopify-exact-store-shop-redact-stop-v2.test.mjs tests/privacy-export-schema-catalog-safety.test.mjs tests/dashboard-single-store-scope.test.mjs tests/shopify-pixel-recovery-candidates-v2.test.mjs tests/shopify-pixel-contact-jurisdiction-delivery-gate-v2.test.mjs tests/shopify-customer-contact-evidence-v2.test.mjs
      - name: Create disposable database baseline
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-v2-test-baseline.sql
      - name: Apply candidate migrations 001 through 029
        env:
          PGPASSWORD: postgres
        run: |
          for migration in \
            supabase/migrations/202611160001_shopify_webhook_identity_foundation.sql \
            supabase/migrations/202611160002_shopify_webhook_verified_inbox_rpc.sql \
            supabase/migrations/202611160003_shopify_oauth_state_app_identity.sql \
            supabase/migrations/202611160004_shopify_oauth_app_aware_finalizer.sql \
            supabase/migrations/202611160005_shopify_app_oauth_secret_resolver.sql \
            supabase/migrations/202611160006_shopify_privacy_webhook_inbox_v2.sql \
            supabase/migrations/202611160007_exact_store_core_lineage_foundation.sql \
            supabase/migrations/202611160008_shopify_pixel_event_inbox_v2.sql \
            supabase/migrations/202611160009_shopify_pixel_identity_graph_v2.sql \
            supabase/migrations/202611160010_shopify_checkout_webhook_projection_v2.sql \
            supabase/migrations/202611160011_shopify_order_conversion_projection_v2.sql \
            supabase/migrations/202611170001_shopify_checkout_recovery_eligibility_v2.sql \
            supabase/migrations/202611170002_shopify_recovery_opportunity_foundation_v2.sql \
            supabase/migrations/202611170003_shopify_email_consent_evidence_v2.sql \
            supabase/migrations/202611170004_shopify_checkout_jurisdiction_projection_v2.sql \
            supabase/migrations/202611170005_shopify_mailer_provider_events_suppression_v2.sql \
            supabase/migrations/202611170006_shopify_single_use_delivery_authorization_v2.sql \
            supabase/migrations/202611170007_shopify_contact_resolution_and_delivery_v2.sql \
            supabase/migrations/202611170008_shopify_delivery_cost_reservations_v2.sql \
            supabase/migrations/202611170009_shopify_exact_store_uninstall_processor_v2.sql \
            supabase/migrations/202611170010_shopify_order_lifecycle_projection_v2.sql \
            supabase/migrations/202611170011_shopify_refund_adjustments_v2.sql \
            supabase/migrations/202611170012_shopify_recovery_attribution_fee_ledger_v2.sql \
            supabase/migrations/202611170013_shopify_ambiguous_delivery_reconciliation_v2.sql \
            supabase/migrations/202611170014_shopify_privacy_processing_queue_v2.sql \
            supabase/migrations/202611170015_shopify_customer_privacy_export_v2.sql \
            supabase/migrations/202611170016_shopify_customer_redaction_impact_preview_v2.sql \
            supabase/migrations/202611170017_shopify_customer_redaction_fk_inventory_v2.sql \
            supabase/migrations/202611170018_shopify_customer_redaction_send_guard_v2.sql \
            supabase/migrations/202611170019_shopify_exact_store_shop_redact_stop_v2.sql \
            supabase/migrations/202611170020_shopify_redacted_store_oauth_tombstone_v2.sql \
            supabase/migrations/202611170021_shopify_privacy_order_scope_v2.sql \
            supabase/migrations/202611170022_shopify_privacy_order_scope_report_v2.sql \
            supabase/migrations/202611170023_shopify_privacy_deadline_monitor_v2.sql \
            supabase/migrations/202611180024_shopify_privacy_completion_evidence_gate_v2.sql \
            supabase/migrations/202611180025_shopify_privacy_export_artifact_registry_v2.sql \
            supabase/migrations/202611180026_shopify_privacy_export_purge_lifecycle_v2.sql \
            supabase/migrations/202611180027_shopify_pixel_recovery_candidates_v2.sql \
            supabase/migrations/202611180028_shopify_general_recovery_opportunities_v2.sql \
            supabase/migrations/202611180029_shopify_customer_contact_evidence_v2.sql; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Exercise two-store pixel cart/browse candidates and opportunity promotion
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-pixel-recovery-candidates-v2.test.sql
      - name: Execute read-only privacy export schema catalog against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/sql/privacy-export-schema-catalog-read-only.sql
      - name: Exercise existing Shopify V2 database contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-v2-database-integration.test.sql
      - name: Exercise exact-store privacy processing queue and lease safety
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-processing-queue-v2.test.sql
      - name: Exercise exact-store privacy export artifact registry
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-export-artifact-registry-v2.test.sql
      - name: Exercise privacy export purge lifecycle
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-export-purge-lifecycle-v2.test.sql
      - name: Exercise Shopify privacy order-scope preservation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-order-scope-v2.test.sql
      - name: Exercise two-store customer session and alias isolation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-exact-store-identity-graph-v2.test.sql
      - name: Exercise verified token-first checkout webhook projection
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-checkout-webhook-projection-v2.test.sql
      - name: Exercise exact-store order conversion suppression
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-order-conversion-projection-v2.test.sql
      - name: Exercise exact-store checkout recovery eligibility
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-checkout-recovery-eligibility-v2.test.sql
      - name: Exercise exact-store recovery opportunity promotion
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-recovery-opportunity-v2.test.sql
      - name: Exercise exact-store email consent evidence and replay safety
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-email-consent-evidence-v2.test.sql
      - name: Exercise checkout jurisdiction projection
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-checkout-jurisdiction-projection-v2.test.sql
      - name: Exercise exact-store MailerSend provider events and suppression
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-mailer-provider-events-suppression-v2.test.sql
      - name: Exercise exact-store customer redaction send guard and authorization race boundary
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-customer-redaction-send-guard-v2.test.sql
      - name: Prepare concurrent merchant-wide cost reservation test
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-delivery-cost-reservation-concurrency-setup-v2.test.sql
      - name: Exercise parallel two-store merchant-wide cost cap
        env:
          PGPASSWORD: postgres
        run: bash tests/sql/shopify-delivery-cost-reservation-concurrency-v2.test.sh

      - name: Exercise exact-store shop/redact stop boundary
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-exact-store-shop-redact-stop-v2.test.sql
