name: HENVALT exact-store identity V2 validation

on:
  push:
    branches: [prep/public-app-hardening-2026-11-15]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-v2-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete repository Node regression suite
        run: npm test
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run exact-store uninstall and checkout provider gate and ambiguous reconciliation contract tests
        run: node --test tests/shopify-exact-store-uninstall-processor-v2.test.mjs tests/shopify-checkout-provider-submission-gate-v2.test.mjs tests/shopify-checkout-ambiguous-provider-reconciliation-v2.test.mjs
      - name: Run identity, cost reservation, and privacy contract tests
        run: node --test tests/customer-session-checkout-writer-audit.test.mjs tests/shopify-exact-store-identity-graph-v2.test.mjs tests/shopify-checkout-webhook-projection-v2.test.mjs tests/shopify-webhook-v2-edge-ingress.test.mjs tests/shopify-order-conversion-projection-v2.test.mjs tests/shopify-checkout-recovery-eligibility-v2.test.mjs tests/shopify-recovery-opportunity-v2.test.mjs tests/shopify-email-consent-evidence-v2.test.mjs tests/shopify-checkout-jurisdiction-projection-v2.test.mjs tests/v2-recipient-resolution-and-delivery-authorization-contract.test.mjs tests/shopify-mailer-provider-events-suppression-v2.test.mjs tests/shopify-single-use-delivery-authorization-v2.test.mjs tests/shopify-contact-resolution-delivery-v2.test.mjs tests/shopify-delivery-cost-reservations-v2.test.mjs tests/shopify-privacy-order-scope-v2.test.mjs tests/shopify-privacy-order-scope-report-v2.test.mjs tests/shopify-privacy-deadline-monitor-v2.test.mjs tests/shopify-privacy-processing-queue-v2.test.mjs tests/shopify-privacy-completion-evidence-gate-v2.test.mjs tests/shopify-privacy-export-artifact-registry-v2.test.mjs tests/shopify-privacy-export-download-v2.test.mjs tests/shopify-privacy-export-purge-lifecycle-v2.test.mjs tests/shopify-privacy-export-processor-v2.test.mjs tests/shopify-customer-privacy-export-v2.test.mjs tests/shopify-customer-redaction-impact-preview-v2.test.mjs tests/shopify-customer-redaction-fk-inventory-v2.test.mjs tests/shopify-customer-redaction-send-guard-v2.test.mjs tests/shopify-exact-store-shop-redact-stop-v2.test.mjs tests/privacy-export-schema-catalog-safety.test.mjs tests/dashboard-single-store-scope.test.mjs tests/shopify-pixel-recovery-candidates-v2.test.mjs tests/shopify-pixel-contact-jurisdiction-delivery-gate-v2.test.mjs tests/shopify-customer-contact-evidence-v2.test.mjs tests/shopify-contact-evidence-resolver-v2.test.mjs tests/shopify-contact-evidence-region-v2.test.mjs tests/shopify-pixel-delivery-boundary-v2.test.mjs tests/shopify-pixel-delivery-eligibility-v2.test.mjs tests/shopify-admin-marketing-consent-lookup-v2.test.mjs tests/shopify-pixel-delivery-permits-v2.test.mjs tests/shopify-pixel-delivery-context-v2.test.mjs tests/shopify-pixel-provider-submission-v2.test.mjs tests/shopify-pixel-attempt-outcome-v2.test.mjs tests/shopify-pixel-stale-reconciler-v2.test.mjs tests/shopify-recovery-work-claims-v2.test.mjs tests/shopify-request-body-hardening-v2.test.mjs tests/dashboard-date-range-v2.test.mjs tests/dashboard-request-race-v2.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run repository Edge Function type checks
        run: npm run check
      - name: Type-check pixel delivery Edge Function
        run: deno check --no-config supabase/functions/henvalt-shopify-pixel-delivery-v2/index.ts
      - name: Type-check checkout delivery Edge Function and shared request reader
        run: deno check --no-config supabase/functions/henvalt-shopify-contact-delivery-v2/index.ts
      - name: Type-check authenticated dashboard Edge Functions
        run: deno check --no-config supabase/functions/henvalt-merchant-dashboard/index.ts supabase/functions/henvalt-dashboard/index.ts
      - name: Type-check MailerSend webhook Edge Function
        run: deno check --no-config supabase/functions/henvalt-mailersend-webhook-v2/index.ts
      - name: Create disposable database baseline
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-v2-test-baseline.sql
      - name: Apply candidate migrations 001 through 060
        env:
          PGPASSWORD: postgres
        run: |
          for migration in \
            supabase/migrations/202611160001_shopify_webhook_identity_foundation.sql \
            supabase/migrations/202611160002_shopify_webhook_verified_inbox_rpc.sql \
            supabase/migrations/202611160003_shopify_oauth_state_app_identity.sql \
            supabase/migrations/202611160004_shopify_oauth_app_aware_finalizer.sql \
            supabase/migrations/202611160005_shopify_app_oauth_secret_resolver.sql \
            supabase/migrations/202611160006_shopify_privacy_webhook_inbox_v2.sql \
            supabase/migrations/202611160007_exact_store_core_lineage_foundation.sql \
            supabase/migrations/202611160008_shopify_pixel_event_inbox_v2.sql \
            supabase/migrations/202611160009_shopify_pixel_identity_graph_v2.sql \
            supabase/migrations/202611160010_shopify_checkout_webhook_projection_v2.sql \
            supabase/migrations/202611160011_shopify_order_conversion_projection_v2.sql \
            supabase/migrations/202611170001_shopify_checkout_recovery_eligibility_v2.sql \
            supabase/migrations/202611170002_shopify_recovery_opportunity_foundation_v2.sql \
            supabase/migrations/202611170003_shopify_email_consent_evidence_v2.sql \
            supabase/migrations/202611170004_shopify_checkout_jurisdiction_projection_v2.sql \
            supabase/migrations/202611170005_shopify_mailer_provider_events_suppression_v2.sql \
            supabase/migrations/202611170006_shopify_single_use_delivery_authorization_v2.sql \
            supabase/migrations/202611170007_shopify_contact_resolution_and_delivery_v2.sql \
            supabase/migrations/202611170008_shopify_delivery_cost_reservations_v2.sql \
            supabase/migrations/202611170009_shopify_exact_store_uninstall_processor_v2.sql \
            supabase/migrations/202611170010_shopify_order_lifecycle_projection_v2.sql \
            supabase/migrations/202611170011_shopify_refund_adjustments_v2.sql \
            supabase/migrations/202611170012_shopify_recovery_attribution_fee_ledger_v2.sql \
            supabase/migrations/202611170013_shopify_ambiguous_delivery_reconciliation_v2.sql \
            supabase/migrations/202611170014_shopify_privacy_processing_queue_v2.sql \
