            supabase/migrations/202611180040_shopify_pixel_recovery_attribution_v2.sql \
            supabase/migrations/202611180041_shopify_v2_dashboard_read_model.sql \
            supabase/migrations/202611180042_shopify_recovery_work_claims_v2.sql \
            supabase/migrations/202611180043_shopify_checkout_intervention_materializer_v2.sql \
            supabase/migrations/202611190001_shopify_recovery_message_context_v2.sql \
            supabase/migrations/202611190002_shopify_sender_profile_preflight_v2.sql \
            supabase/migrations/202611190003_mailersend_webhook_test_signature_v2.sql \
            supabase/migrations/202611190004_shopify_checkout_candidate_terminal_state_v2.sql \
            supabase/migrations/202611190005_shopify_checkout_provider_submission_gate_v2.sql \
            supabase/migrations/202611190006_shopify_checkout_ambiguous_provider_reconciliation_v2.sql; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Exercise two-store pixel cart/browse candidates and opportunity promotion
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-pixel-recovery-candidates-v2.test.sql
      - name: Execute read-only privacy export schema catalog against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/sql/privacy-export-schema-catalog-read-only.sql
      - name: Exercise existing Shopify V2 database contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-v2-database-integration.test.sql
      - name: Exercise seeded V2 dashboard read model and store isolation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-v2-dashboard-read-model.test.sql
      - name: Exercise exact-store privacy processing queue and lease safety
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-processing-queue-v2.test.sql
      - name: Exercise exact-store privacy export artifact registry
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/shopify-privacy-export-artifact-registry-v2.test.sql
      - name: Exercise privacy export purge lifecycle
        env:
