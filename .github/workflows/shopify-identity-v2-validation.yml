            supabase/migrations/202611180026_shopify_privacy_export_purge_lifecycle_v2.sql \
            supabase/migrations/202611180027_shopify_pixel_recovery_candidates_v2.sql \
            supabase/migrations/202611180028_shopify_general_recovery_opportunities_v2.sql \
            supabase/migrations/202611180029_shopify_customer_contact_evidence_v2.sql \
            supabase/migrations/202611180030_shopify_contact_lookup_context_v2.sql \
            supabase/migrations/202611180031_shopify_contact_jurisdiction_region_v2.sql \
            supabase/migrations/202611180032_shopify_pixel_delivery_eligibility_v2.sql \
            supabase/migrations/202611180033_shopify_admin_marketing_consent_lookup_v2.sql \
            supabase/migrations/202611180034_shopify_pixel_delivery_permits_v2.sql \
            supabase/migrations/202611180035_shopify_pixel_delivery_context_v2.sql \
            supabase/migrations/202611180036_shopify_pixel_provider_submission_gate_v2.sql \
            supabase/migrations/202611180037_shopify_pixel_attempt_outcome_reconciliation_v2.sql \
            supabase/migrations/202611180038_shopify_pixel_stale_attempt_reconciler_v2.sql \
