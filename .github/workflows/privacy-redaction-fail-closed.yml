name: Privacy redaction fail-closed contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/privacy-redaction-fail-closed.yml"
      - "supabase/migrations/202611260003_privacy_redaction_fail_closed_until_connection_scope.sql"
      - "tests/shopify-privacy-redaction-connection-scope.test.mjs"

permissions:
  contents: read

jobs:
  redaction-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tenant-wide destructive routines cannot be reached by lease wrappers
        run: node --test tests/shopify-privacy-redaction-connection-scope.test.mjs
