name: HENVALT pixel foundation checks

on:
  push:
    branches:
      - feature/web-pixel-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Pixel SDK
        run: npm install --prefix extensions/henvalt-web-pixel --ignore-scripts

      - name: Validate JavaScript syntax
        run: |
          node --check extensions/henvalt-web-pixel/src/index.js
          node --check workers/pixel-collector/src/index.js

      - name: Validate Shopify TOML and privacy configuration
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          app = tomllib.loads(Path("shopify.app.toml").read_text())
          pixel = tomllib.loads(Path("extensions/henvalt-web-pixel/shopify.extension.toml").read_text())

          required_scopes = {"write_pixels", "read_customer_events"}
          actual_scopes = set(app["access_scopes"]["scopes"].split(","))
          assert required_scopes.issubset(actual_scopes), actual_scopes
          assert "https://henvalt-pixel-collector.chmuhammadrehan18.workers.dev" in app["network_access"]["allowed_sources"]
          assert pixel["type"] == "web_pixel_extension"
          assert pixel["runtime_context"] == "strict"
          assert pixel["customer_privacy"] == {
              "analytics": True,
              "marketing": False,
              "preferences": False,
              "sale_of_data": "disabled",
          }
          assert {"collectorUrl", "publicKey"}.issubset(pixel["settings"]["fields"])
          print("Shopify app and Web Pixel configuration checks passed.")
          PY


      - name: Verify deployed collector and server-side rejection path
        env:
          COLLECTOR_URL: https://henvalt-pixel-collector.chmuhammadrehan18.workers.dev
        run: |
          node --input-type=module <<'JS'
          const base = process.env.COLLECTOR_URL;
          const health = await fetch(base + "/health");
          if (!health.ok) throw new Error("Collector health check failed: " + health.status);
          const healthBody = await health.json();
          if (healthBody.ok !== true || healthBody.service !== "henvalt-pixel-collector") {
            throw new Error("Collector health response was invalid");
          }

          const runId = process.env.GITHUB_RUN_ID || String(Date.now());
          const response = await fetch(base + "/v1/events", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "origin": "https://ci-" + runId + ".invalid"
            },
            body: JSON.stringify({
              schema_version: 1,
              event_id: "ci-" + runId,
              event_type: "page_viewed",
              occurred_at: new Date().toISOString(),
              client_id: "ci-smoke-" + runId,
              page_url: "https://example.invalid/",
              public_key: "f".repeat(64)
            })
          });
          const body = await response.json().catch(() => ({}));
          if (response.status !== 401 || body.error !== "event_rejected") {
            throw new Error("Expected an unauthorized unknown pixel key rejection; got " + response.status + " " + JSON.stringify(body));
          }
          console.log("Collector health and authenticated RPC rejection smoke checks passed.");
          JS
      - name: Ensure collector has no service-role credential assignments
        run: |
          if grep -R -n -E '^[[:space:]]*SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' workers/pixel-collector; then
            echo "A service-role key assignment was found in the collector."
            exit 1
          fi
