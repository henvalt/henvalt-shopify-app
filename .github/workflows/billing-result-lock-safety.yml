name: HENVALT billing lock safety

on:
  pull_request:
    paths:
      - "supabase/migrations/202611220011_billing_refund_credit_offsets.sql"
      - "supabase/migrations/202611220014_billing_result_lock_order_and_monotonicity.sql"
      - "tests/billing-refund-credit-offsets.test.mjs"
      - "tests/billing-refund-credit-offsets-postgres-acceptance.sql"
      - "tests/billing-refund-credit-concurrency-postgres.sh"
      - "tests/provider-send-interlock-postgres-bootstrap.sql"
      - "tests/shopify-usage-billing-worker.test.mjs"
      - "n8n/shopify-recovery-billing-candidate-builder.mjs"
  push:
    branches:
      - "work/48h-system-readiness-2026-11-21"
    paths:
      - "supabase/migrations/202611220011_billing_refund_credit_offsets.sql"
      - "supabase/migrations/202611220014_billing_result_lock_order_and_monotonicity.sql"
      - "tests/billing-refund-credit-offsets.test.mjs"
      - "tests/billing-refund-credit-offsets-postgres-acceptance.sql"
      - "tests/billing-refund-credit-concurrency-postgres.sh"
      - "tests/provider-send-interlock-postgres-bootstrap.sql"
      - "tests/shopify-usage-billing-worker.test.mjs"
      - "n8n/shopify-recovery-billing-candidate-builder.mjs"
  workflow_dispatch:

jobs:
  billing-lock-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run billing and scheduler static tests
        run: |
          node --test \
            tests/billing-refund-credit-offsets.test.mjs \
            tests/shopify-usage-billing-worker.test.mjs
      - name: Bootstrap disposable PostgreSQL fixture
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/provider-send-interlock-postgres-bootstrap.sql
      - name: Apply refund credit offset migration
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611220011_billing_refund_credit_offsets.sql
      - name: Apply billing result lock-order migration
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611220014_billing_result_lock_order_and_monotonicity.sql
      - name: Exercise billing isolation, reconciliation repair and monotonic results
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/billing-refund-credit-offsets-postgres-acceptance.sql
      - name: Exercise concurrent refund credit allocation
        run: bash tests/billing-refund-credit-concurrency-postgres.sh
