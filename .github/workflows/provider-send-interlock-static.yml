  workflow_dispatch:
  push:
    branches:
      - work/48h-system-readiness-2026-11-21

permissions:
  contents: read

jobs:
  interlock-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static safety and pixel consent invariants
        run: node --test tests/dashboard-privacy-export.test.mjs tests/shopify-privacy-deployment-runbook.test.mjs tests/shopify-privacy-export-ack.test.mjs tests/shopify-privacy-lease-migration.test.mjs tests/shopify-privacy-redaction-guards.test.mjs tests/shopify-privacy-handler-candidate.test.mjs tests/shopify-privacy-retention.test.mjs tests/provider-send-interlock-static.test.mjs tests/mailersend-delivery-envelope-binding.test.mjs tests/pixel-consent-static.test.mjs tests/token-refresh-window-static.test.mjs tests/n8n-delivery-route-snapshot.test.mjs tests/n8n-shopify-ingest-route-snapshot.test.mjs tests/n8n-recovery-route-snapshot.test.mjs tests/henvalt-mailersend-delivery-handler.test.mjs tests/mailersend-setup-redirect.test.mjs tests/revenue-ledger-attribution-promotion.test.mjs tests/shopify-oauth-completion-url.test.mjs tests/shopify-oauth-infrastructure-config.test.mjs tests/shopify-oauth-webhook-contract.test.mjs tests/shopify-webhook-ingress-handler.test.mjs tests/shopify-ingest-ack-contract.test.mjs tests/shopify-replay-worker-spec-static.test.mjs tests/shopify-replay-business-write-fencing-static.test.mjs tests/shopify-replay-tenant-binding-static.test.mjs tests/shopify-replay-object-tenant-binding-static.test.mjs tests/shopify-replay-lease-concurrency-static.test.mjs tests/shopify-recovery-replay-branch-contract.test.mjs tests/shopify-recovery-delivery-retry-branch-contract.test.mjs tests/shopify-recovery-replay-graph-patch-static.test.mjs tests/shopify-replay-claim-normalizer.test.mjs tests/shopify-replay-claim-normalizer-node-static.test.mjs tests/shopify-ingest-replay-envelope.test.mjs tests/shopify-ingest-ack-classifier-candidate.test.mjs tests/shopify-ingest-replay-entry-static.test.mjs tests/shopify-ingest-candidate-builder.test.mjs tests/shopify-ingest-full-export-candidate.test.mjs tests/active-workflow-cutover-contract-static.test.mjs tests/billing-refund-credit-offsets.test.mjs tests/dashboard-net-revenue.test.mjs tests/shopify-order-edit-revenue-reconciliation.test.mjs tests/shopify-usage-billing-worker.test.mjs tests/billing-reconciliation-handler.test.mjs tests/billing-reconciliation-dashboard.test.mjs tests/control-plane-v24-baseline.test.mjs tests/production-edge-function-baseline.test.mjs tests/merchant-dashboard-api-contract.test.mjs tests/shopify-privacy-body-limiter.test.mjs
      - name: Generate full offline no-send HENVALT_INGEST candidate export
        run: node n8n/shopify-ingest-candidate-builder.mjs n8n/fixtures/henvalt-ingest-active-2026-11-21.sanitized.json n8n/HENVALT_INGEST_CANDIDATE_NO_SEND.json 6368d539-708f-494a-8be8-b9601d0e8607
      - name: Upload offline no-send workflow candidate
        uses: actions/upload-artifact@v4
        with:
          name: henvalt-ingest-candidate-no-send
          path: n8n/HENVALT_INGEST_CANDIDATE_NO_SEND.json
          if-no-files-found: error
          retention-days: 7
      - name: Test full recovery candidate graph and safety invariants
        run: node --test tests/shopify-recovery-full-export-candidate.test.mjs
      - name: Test full delivery no-send candidate graph and provider-egress invariants
        run: node --test tests/shopify-delivery-full-export-candidate.test.mjs
      - name: Generate full offline no-send HENVALT_RECOVERY candidate export
        run: node n8n/shopify-recovery-candidate-builder.mjs
      - name: Parse and verify generated recovery candidate JSON
        run: node --input-type=module -e 'import fs from "node:fs"; const w = JSON.parse(fs.readFileSync("n8n/HENVALT_RECOVERY_CANDIDATE_NO_SEND.json", "utf8")); if (w.active !== false || w.id !== "00000000-0000-4000-8000-999999999997" || w.nodes.length !== 74) process.exit(1)'
      - name: Upload offline no-send recovery workflow candidate
        uses: actions/upload-artifact@v4
        with:
          name: henvalt-recovery-candidate-no-send
          path: n8n/HENVALT_RECOVERY_CANDIDATE_NO_SEND.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate recovery billing scheduler staging-only candidate
        run: node n8n/shopify-recovery-billing-candidate-builder.mjs
      - name: Parse and verify recovery billing scheduler candidate JSON
        run: node --input-type=module -e 'import fs from "node:fs"; const w = JSON.parse(fs.readFileSync("n8n/HENVALT_RECOVERY_CANDIDATE_BILLING_STAGING_ONLY.json", "utf8")); const s = JSON.stringify(w); if (w.active !== false || w.id !== "00000000-0000-4000-8000-999999999995" || w.nodes.length !== 62 || !s.includes("supabase-staging.invalid/functions/v1/henvalt-shopify-usage-billing") || s.includes("ocyplckdojdubyrsxcxa.supabase.co")) process.exit(1)'
      - name: Upload recovery billing scheduler staging-only candidate
        uses: actions/upload-artifact@v4
        with:
          name: henvalt-recovery-billing-staging-candidate
          path: n8n/HENVALT_RECOVERY_CANDIDATE_BILLING_STAGING_ONLY.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate full offline no-send HENVALT_DELIVERY candidate export
        run: node n8n/shopify-delivery-candidate-builder.mjs
      - name: Parse and verify generated delivery candidate JSON
        run: node --input-type=module -e 'import fs from "node:fs"; const w = JSON.parse(fs.readFileSync("n8n/HENVALT_DELIVERY_CANDIDATE_NO_SEND.json", "utf8")); if (w.active !== false || w.id !== "00000000-0000-4000-8000-999999999996" || w.nodes.length !== 54) process.exit(1)'
      - name: Validate cross-workflow candidate package boundaries
        run: node --test tests/shopify-three-workflow-candidate-package.test.mjs
      - name: Upload offline no-send delivery workflow candidate
        uses: actions/upload-artifact@v4
        with:
          name: henvalt-delivery-candidate-no-send
          path: n8n/HENVALT_DELIVERY_CANDIDATE_NO_SEND.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate candidate Shopify app TOML privacy subscriptions
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          app = tomllib.loads(pathlib.Path("shopify.app.toml").read_text())
          subscriptions = app["webhooks"]["subscriptions"]
          topics = [topic for item in subscriptions for topic in item.get("compliance_topics", [])]
          assert set(topics) == {"customers/data_request", "customers/redact", "shop/redact"}
          privacy = [item for item in subscriptions if item.get("compliance_topics")]
          assert len(privacy) == 1
          assert privacy[0]["uri"] == "https://ocyplckdojdubyrsxcxa.supabase.co/functions/v1/henvalt-shopify-privacy"
          print("SHOPIFY_PRIVACY_COMPLIANCE_TOML_ACCEPTANCE_PASSED")
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Assert mandatory Shopify privacy compliance remains a release gate
        run: node --test tests/shopify-privacy-compliance-blocker.test.mjs tests/shopify-privacy-deployed-baseline.test.mjs
      - name: Type-check Shopify OAuth Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-shopify-oauth/index.ts
      - name: Type-check Shopify usage billing Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-shopify-usage-billing/index.ts
      - name: Type-check billing reconciliation Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-billing-reconciliation/index.ts
      - name: Type-check MailerSend delivery Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-mailersend-delivery/index.ts
      - name: Type-check MailerSend provider setup Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-mailersend-setup/index.ts
      - name: Type-check Shopify privacy Edge Function at deployment path
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-shopify-privacy/index.ts
      - name: Type-check merchant privacy export Edge Function at deployment path
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-privacy-export/index.ts
      - name: Type-check merchant dashboard Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/henvalt-merchant-dashboard/index.ts
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable PostgreSQL 17 fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/provider-send-interlock-postgres-bootstrap.sql
      - name: Apply candidate interlock migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611210001_provider_send_interlock_v1.sql
      - name: Apply confirmed recovery ledger promotion migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611220010_promote_confirmed_recovery_ledger.sql
      - name: Exercise probable-to-confirmed recovery ledger promotion
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/revenue-ledger-attribution-promotion-postgres-acceptance.sql
      - name: Apply refund credit offset migration to disposable PostgreSQL
        env:
